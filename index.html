<!DOCTYPE html>
<html>
<head>
  <title>RSVP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; max-width: 420px; margin: auto; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin-top: 8px; }
    #suggestions div { padding: 8px; border-bottom: 1px solid #ddd; cursor: pointer; }
    #suggestions div:hover { background: #f0f0f0; }
  </style>
</head>
<body>

<h2>RSVP</h2>

<input
  type="text"
  id="guestName"
  placeholder="Enter your full name"
  oninput="showSuggestions()"
/>

<div id="suggestions"></div>

<button onclick="checkSeats()">Confirm RSVP</button>

<p id="seatInfo"></p>

<div id="companions" style="display:none;">
  <h3>Companion Names</h3>
  <div id="companionFields"></div>
  <button onclick="submitRSVP()">Confirm Companions</button>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZEZOTzlu-F1FSoZUyD9ITXUN_D5QkxrzXm_jx-5XQ4dTOoruTbAV94XymJlsnYMXx/exec"; //
let guestNames = [];
let seatCount = 0;

// Fetch guest list for auto-suggest
fetch(`${WEB_APP_URL}?list=true`)
  .then(res => res.json())
  .then(data => guestNames = data);

function showSuggestions() {
  const input = document.getElementById("guestName").value.toLowerCase();
  const box = document.getElementById("suggestions");
  box.innerHTML = "";

  if (!input) return;

  guestNames
    .filter(n => n.toLowerCase().includes(input))
    .slice(0, 5)
    .forEach(name => {
      const div = document.createElement("div");
      div.textContent = name;
      div.onclick = () => {
        document.getElementById("guestName").value = name;
        box.innerHTML = "";
      };
      box.appendChild(div);
    });
}

function checkSeats() {
  const name = document.getElementById("guestName").value;

  fetch(`${WEB_APP_URL}?name=${encodeURIComponent(name)}`)
    .then(res => res.json())
    .then(data => {
      if (!data.seats || data.seats === "Not found") {
        document.getElementById("seatInfo").innerText =
          "Name not found. Please select your name from the list.";
        return;
      }

      seatCount = data.seats;
      document.getElementById("seatInfo").innerText =
        `You have ${seatCount} reserved seat(s).`;

      let fields = "";
      for (let i = 1; i < seatCount; i++) {
        fields += `<input type="text" placeholder="Companion ${i} Name">`;
      }
      document.getElementById("companionFields").innerHTML = fields;
      document.getElementById("companions").style.display = "block";
    });
}

function submitRSVP() {
  const companions = [];
  document.querySelectorAll("#companionFields input").forEach(i => {
    if (i.value) companions.push(i.value);
  });

  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({
      mainGuest: document.getElementById("guestName").value,
      companions: companions
    })
  }).then(() => {
    alert("RSVP submitted successfully!");
  });
}
</script>

</body>
</html>
